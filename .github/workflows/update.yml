name: Update IPTV Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate playlists
        run: python scripts/group_playlist.py
      - name: Cross-sync from Garden working playlist
        run: python scripts/sync_garden.py
      - name: Validate playlists
        run: |
          test -s playlist_working.m3u
          test -s playlist_nonworking.m3u
          grep -q '^#EXTM3U' playlist_working.m3u
          grep -q '^#EXTM3U' playlist_nonworking.m3u
          echo "Working entries:"
          grep -c '^#EXTINF:' playlist_working.m3u || true
          echo "Non-working entries:"
          grep -c '^#EXTINF:' playlist_nonworking.m3u || true
      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist_working.m3u playlist_nonworking.m3u cross_sync.json
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update IPTV playlists and cross-sync Garden"
            git push
          fi
