name: Update IPTV Playlists

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'
      - 'fetch_sources.py'
      - 'scripts/group_playlist.py'
      - 'scripts/sync_garden.py'
      - 'scripts/add_garden_movies.py'
      - 'scripts/sony_star_india.py'
      - 'scripts/merge_worldwide_sony_star.py'
      - 'scripts/garden_3502_source_compare.py'
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate playlists
        run: python scripts/group_playlist.py
      - name: Add missing Garden movie streams by URL
        run: python scripts/add_garden_movies.py
      - name: Cross-sync from Garden working playlist
        run: python scripts/sync_garden.py
      - name: Add missing worldwide Indian Sony and Star streams
        run: python scripts/merge_worldwide_sony_star.py
      - name: Generate exact Indian Sony and Star playlist
        run: python scripts/sony_star_india.py
      - name: Compare Garden and 3502 actual sources
        run: python scripts/garden_3502_source_compare.py
      - name: Generate source report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read_playlist(path):
              rows=[]
              p=Path(path)
              if not p.exists(): return rows
              lines=p.read_text(errors='ignore').splitlines()
              name=''
              for line in lines:
                  if line.startswith('#EXTINF:'):
                      name=line.split(',',1)[-1].strip() if ',' in line else ''
                  elif name and line.strip() and not line.startswith('#'):
                      rows.append((name,line.strip())); name=''
              return rows

          working=read_playlist('playlist_working.m3u')
          nonworking=read_playlist('playlist_nonworking.m3u')
          sony_star=read_playlist('playlists/sony-star-india.m3u')
          source_url='https://iptv-org.github.io/iptv/index.m3u'
          out=['IPTV PLAYLIST SOURCE REPORT','===========================','',
               'Source: '+source_url,
               'Total Channels: '+str(len(working)+len(nonworking)),
               'Working Channels: '+str(len(working)),
               'Non-Working Channels: '+str(len(nonworking)),
               'Indian Sony + Star Working: '+str(len(sony_star)),'',
               'WORKING CHANNELS','-----------------']
          out += [n for n,_ in working]
          out += ['', 'NON-WORKING CHANNELS','--------------------']
          out += [n for n,_ in nonworking]
          out += ['', 'INDIAN SONY + STAR WORKING','--------------------------']
          out += [n for n,_ in sony_star]
          out += ['', 'Note: This report is regenerated automatically with every playlist update.']
          Path('source.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'Working: {len(working)}')
          print(f'Non-working: {len(nonworking)}')
          print(f'Indian Sony + Star: {len(sony_star)}')
          PY
      - name: Validate playlists
        run: |
          test -s playlist_working.m3u
          test -s playlist_nonworking.m3u
          test -s playlists/sony-star-india.m3u
          test -s source.txt
          test -s garden_3502_source_comparison.md
          grep -q '^#EXTM3U' playlist_working.m3u
          grep -q '^#EXTM3U' playlist_nonworking.m3u
          grep -q '^#EXTM3U' playlists/sony-star-india.m3u
      - name: Commit updated playlists and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist_working.m3u playlist_nonworking.m3u playlists/sony-star-india.m3u cross_sync.json source.txt garden_3502_source_comparison.md
          if git diff --cached --quiet; then
            echo "No playlist/report changes."
          else
            git commit -m "Update playlists and Garden 3502 source comparison"
            git push
          fi
