name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout playlist repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch wizakorhd IPTV source
        run: |
          rm -rf source_repo
          git clone --depth 1 https://github.com/wizakorhd/iptv.git source_repo

      - name: Prepare source playlists
        run: |
          rm -rf sources
          mkdir -p sources

          find source_repo -maxdepth 1 -type f \
            \( -name "*.m3u" -o -name "*.m3u8" \) \
            -exec cp {} sources/ \;

          echo "Source playlists:"
          ls -lh sources

      - name: Generate grouped playlist
        run: |
          python scripts/group_playlist.py sources -o playlist.m3u

      - name: Validate playlist
        run: |
          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u
          echo "Playlist generated successfully"
          echo "Entries:"
          grep -c '^#EXTINF:' playlist.m3u || true
          echo "Groups:"
          grep '^#EXTINF:' playlist.m3u \
            | sed -n 's/.*group-title="\([^"]*\)".*/\1/p' \
            | sort | uniq -c | sort -nr

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update IPTV playlist"
            git push
          fi
