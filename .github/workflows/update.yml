name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Create source directory
        run: mkdir -p sources

      - name: Fetch source playlists
        shell: bash
        run: |
          set -e

          # Yahan PUBLIC/LEGAL M3U playlist URLs add karo.
          # Example:
          # "https://example.com/playlist.m3u"

          URLS=(
            # "https://example.com/playlist.m3u"
          )

          i=0
          for url in "${URLS[@]}"; do
            i=$((i + 1))
            echo "[+] Fetching source $i"

            curl -L --fail --retry 3 \
              --connect-timeout 20 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "sources/source_${i}.m3u"
          done

      - name: Group and build playlist
        run: |
          python scripts/group_playlist.py sources -o playlist.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u sources/

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Auto update IPTV playlist"
          git push
