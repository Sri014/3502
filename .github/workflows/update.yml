name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Get the current public playlist data used by wizakorhd/iptv.
      - name: Fetch wizakorhd source
        run: |
          set -e

          rm -rf source_repo
          git clone --depth 1 \
            https://github.com/wizakorhd/iptv.git \
            source_repo

          mkdir -p sources

          # Copy the source playlists.
          cp source_repo/playlist.m3u sources/wizakorhd.m3u

          # Keep the separate language playlists too.
          for file in \
            playlist-hindi.m3u \
            playlist-english-india.m3u \
            playlist-english-intl.m3u \
            playlist-anime.m3u
          do
            if [ -f "source_repo/$file" ]; then
              cp "source_repo/$file" "sources/$file"
            fi
          done

          echo "Sources:"
          ls -lh sources/

      # Our grouping engine:
      # - no duplicate removal
      # - preserves every stream
      # - normalizes categories
      # - keeps Hindi/English/Bhojpuri etc.
      # - keeps worldwide streams when present
      - name: Build grouped playlist
        run: |
          python scripts/group_playlist.py \
            sources \
            --output playlist.m3u

      - name: Validate playlist
        run: |
          set -e

          test -s playlist.m3u
          grep -q '^#EXTM3U' playlist.m3u

          CHANNELS=$(grep -c '^#EXTINF:' playlist.m3u || true)

          echo "Total channels: $CHANNELS"

          if [ "$CHANNELS" -le 0 ]; then
            echo "No channels generated."
            exit 1
          fi

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto update IPTV playlist"
          git push
